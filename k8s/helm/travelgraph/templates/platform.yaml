apiVersion: v1
kind: Secret
metadata:
  name: travelgraph-secrets
  labels:
    {{- include "travelgraph.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ .Values.secrets.postgresPassword | quote }}
  jwt-signing-key: {{ .Values.secrets.jwtSigningKey | quote }}
  identity-hmac-key: {{ .Values.secrets.identityHmacKey | quote }}
  grafana-admin-password: {{ .Values.secrets.grafanaAdminPassword | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels:
    {{- include "travelgraph.labels" . | nindent 4 }}
data:
  01-schemas.sql: |
    CREATE SCHEMA IF NOT EXISTS property_schema;
    CREATE SCHEMA IF NOT EXISTS pricing_schema;
    CREATE SCHEMA IF NOT EXISTS booking_schema;
    CREATE SCHEMA IF NOT EXISTS user_schema;
    CREATE SCHEMA IF NOT EXISTS review_schema;
    CREATE SCHEMA IF NOT EXISTS schema_registry;
    GRANT ALL ON SCHEMA property_schema TO travelgraph;
    GRANT ALL ON SCHEMA pricing_schema TO travelgraph;
    GRANT ALL ON SCHEMA booking_schema TO travelgraph;
    GRANT ALL ON SCHEMA user_schema TO travelgraph;
    GRANT ALL ON SCHEMA review_schema TO travelgraph;
    GRANT ALL ON SCHEMA schema_registry TO travelgraph;
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: router-config
  labels:
    {{- include "travelgraph.labels" . | nindent 4 }}
data:
  router.toml: |
    [server]
    port = 8080
    default_subgraph_timeout_ms = 1000
    [supergraph]
    path = "/app/supergraph/supergraph.graphql"
    [timeouts]
    [http_client]
    pool_max_idle_per_host = 50
    pool_idle_timeout_sec = 90
    tcp_keepalive_sec = 90
    [reliability]
    retry_max_attempts = 2
    retry_initial_backoff_ms = 10
    retry_max_backoff_ms = 250
    circuit_window_sec = 60
    circuit_min_samples = 8
    circuit_failure_ratio = 0.5
    circuit_open_recovery_sec = 15
    [cache]
    enabled = true
    redis_url = "redis://redis:6379"
    ttl_property_read_sec = 600
    ttl_search_sec = 120
    ttl_pricing_sec = 30
    ttl_review_summary_sec = 300
    [limits]
    max_depth = 10
    max_cost = 1000
    [rate_limit]
    default_requests_per_sec = 100
    default_burst = 100
    [auth]
    jwt_secret = "travelgraph-dev-jwt-secret"
    identity_signature_secret = "travelgraph-dev-identity-secret"
    [persisted_queries]
    path = "/app/persisted-queries.json"
    allow_arbitrary_queries = false
    [usage]
    endpoint = "http://schema-registry:8090/usage"
    enabled = true
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    {{- include "travelgraph.labels" . | nindent 4 }}
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  selector:
    app.kubernetes.io/name: postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  labels:
    app.kubernetes.io/name: postgres
    {{- include "travelgraph.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.postgres.storage | quote }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    {{- include "travelgraph.labels" . | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: travelgraph
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: travelgraph
            - name: POSTGRES_DB
              value: travelgraph
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: travelgraph-secrets
                  key: postgres-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    {{- include "travelgraph.labels" . | nindent 4 }}
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  selector:
    app.kubernetes.io/name: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    {{- include "travelgraph.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: travelgraph
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          ports:
            - name: redis
              containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: schema-registry
  labels:
    app.kubernetes.io/name: schema-registry
    {{- include "travelgraph.labels" . | nindent 4 }}
spec:
  ports:
    - name: http
      port: 8090
      targetPort: 8090
  selector:
    app.kubernetes.io/name: schema-registry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry
  labels:
    app.kubernetes.io/name: schema-registry
    {{- include "travelgraph.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.schemaRegistry.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: schema-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: schema-registry
        app.kubernetes.io/part-of: travelgraph
    spec:
      containers:
        - name: schema-registry
          image: {{ include "travelgraph.image" (dict "root" . "image" .Values.schemaRegistry.image) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: travelgraph
            - name: DB_USER
              value: travelgraph
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: travelgraph-secrets
                  key: postgres-password
            - name: COMPOSER_NODE_BIN
              value: node
            - name: COMPOSER_HELPER_ROOT
              value: /app/node-helper
            - name: AI_SCHEMA_ASSISTANT_URL
              value: http://ai-schema-assistant:8091
          resources:
            {{- toYaml .Values.schemaRegistry.resources | nindent 12 }}
{{- if .Values.aiSchemaAssistant.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-schema-assistant
  labels:
    app.kubernetes.io/name: ai-schema-assistant
    {{- include "travelgraph.labels" . | nindent 4 }}
spec:
  ports:
    - name: http
      port: 8091
      targetPort: 8091
  selector:
    app.kubernetes.io/name: ai-schema-assistant
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-schema-assistant
  labels:
    app.kubernetes.io/name: ai-schema-assistant
    {{- include "travelgraph.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.aiSchemaAssistant.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-schema-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-schema-assistant
        app.kubernetes.io/part-of: travelgraph
    spec:
      containers:
        - name: ai-schema-assistant
          image: {{ include "travelgraph.image" (dict "root" . "image" .Values.aiSchemaAssistant.image) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8091
          env:
            - name: ANTHROPIC_MODEL
              value: {{ .Values.aiSchemaAssistant.model | quote }}
{{- end }}
---
{{- range .Values.subgraphs }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  labels:
    app.kubernetes.io/name: {{ .name }}
    app.kubernetes.io/part-of: travelgraph
spec:
  ports:
    - name: http
      port: {{ .port }}
      targetPort: {{ .port }}
  selector:
    app.kubernetes.io/name: {{ .name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels:
    app.kubernetes.io/name: {{ .name }}
    app.kubernetes.io/part-of: travelgraph
spec:
  replicas: {{ .replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .name }}
        app.kubernetes.io/part-of: travelgraph
        travelgraph.io/tier: subgraph
    spec:
      containers:
        - name: {{ .name }}
          image: {{ include "travelgraph.image" (dict "root" $ "image" .image) | quote }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .port }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ $.Values.subgraphDefaults.springProfile | quote }}
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: travelgraph
            - name: DB_USER
              value: travelgraph
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: travelgraph-secrets
                  key: postgres-password
            - name: SCHEMA_REGISTRY_URL
              value: http://schema-registry:8090
            - name: TRAVELGRAPH_IDENTITY_SECRET
              valueFrom:
                secretKeyRef:
                  name: travelgraph-secrets
                  key: identity-hmac-key
            {{- range $key, $value := .env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            {{- toYaml $.Values.subgraphDefaults.resources | nindent 12 }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: router
  labels:
    app.kubernetes.io/name: router
    {{- include "travelgraph.labels" . | nindent 4 }}
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app.kubernetes.io/name: router
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: router
  labels:
    app.kubernetes.io/name: router
    {{- include "travelgraph.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.router.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: router
        app.kubernetes.io/part-of: travelgraph
    spec:
      initContainers:
        - name: compose-supergraph
          image: curlimages/curl:8.11.1
          command:
            - sh
            - -ec
            - |
              for attempt in $(seq 1 120); do
                response="$(curl -fsS -X POST http://schema-registry:8090/supergraph/compose || true)"
                if echo "$response" | grep -q '"ok":true'; then
                  curl -fsS http://schema-registry:8090/supergraph/latest -o /supergraph/supergraph.graphql
                  exit 0
                fi
                sleep 2
              done
              exit 1
          volumeMounts:
            - name: supergraph
              mountPath: /supergraph
      containers:
        - name: router
          image: {{ include "travelgraph.image" (dict "root" . "image" .Values.router.image) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ROUTER_CONFIG
              value: /app/config/router.toml
            - name: ROUTER_REDIS_URL
              value: redis://redis:6379
            - name: ROUTER_CACHE_ENABLED
              value: "true"
            - name: ROUTER_ALLOW_ARBITRARY_QUERIES
              value: {{ .Values.router.allowArbitraryQueries | quote }}
            - name: ROUTER_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: travelgraph-secrets
                  key: jwt-signing-key
            - name: TRAVELGRAPH_IDENTITY_SECRET
              valueFrom:
                secretKeyRef:
                  name: travelgraph-secrets
                  key: identity-hmac-key
            {{- range $key, $value := .Values.router.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.router.resources | nindent 12 }}
          volumeMounts:
            - name: router-config
              mountPath: /app/config/router.toml
              subPath: router.toml
              readOnly: true
            - name: supergraph
              mountPath: /app/supergraph
      volumes:
        - name: router-config
          configMap:
            name: router-config
        - name: supergraph
          emptyDir: {}
{{- if .Values.grafana.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    {{- include "travelgraph.labels" . | nindent 4 }}
spec:
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  selector:
    app.kubernetes.io/name: grafana
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    {{- include "travelgraph.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: travelgraph
    spec:
      containers:
        - name: grafana
          image: {{ .Values.grafana.image | quote }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SERVER_ROOT_URL
              value: {{ .Values.grafana.rootUrl | quote }}
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: travelgraph-secrets
                  key: grafana-admin-password
{{- end }}
{{- if .Values.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: router
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: router
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.targetCPUUtilizationPercentage }}
{{- range .Values.subgraphs }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .name }}
  minReplicas: {{ $.Values.hpa.minReplicas }}
  maxReplicas: {{ $.Values.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $.Values.hpa.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: subgraphs-from-router-only
spec:
  podSelector:
    matchExpressions:
      - key: travelgraph.io/tier
        operator: In
        values: ["subgraph"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: router
      ports:
{{- range .Values.subgraphs }}
        - protocol: TCP
          port: {{ .port }}
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: travelgraph
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /graphql
            pathType: Prefix
            backend:
              service:
                name: router
                port:
                  number: 8080
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
{{- end }}
