global:
  imageRegistry: ghcr.io/travelgraph-platform
  imageTag: latest
  imagePullPolicy: IfNotPresent

secrets:
  postgresPassword: travelgraph
  jwtSigningKey: travelgraph-dev-jwt-secret
  identityHmacKey: travelgraph-dev-identity-secret
  grafanaAdminPassword: admin

postgres:
  image: postgres:16-alpine
  storage: 5Gi

redis:
  image: redis:7-alpine

schemaRegistry:
  replicaCount: 1
  image: travelgraph-schema-registry
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

aiSchemaAssistant:
  enabled: false
  replicaCount: 1
  image: travelgraph-ai-schema-assistant
  model: claude-3-5-sonnet-latest

router:
  replicaCount: 1
  image: travelgraph-router
  allowArbitraryQueries: false
  env: {}
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

subgraphs:
  - name: property-service
    image: travelgraph-property-service
    port: 8081
    replicaCount: 1
    env: {}
  - name: pricing-service
    image: travelgraph-pricing-service
    port: 8082
    replicaCount: 1
    env: {}
  - name: booking-service
    image: travelgraph-booking-service
    port: 8083
    replicaCount: 1
    env: {}
  - name: user-service
    image: travelgraph-user-service
    port: 8084
    replicaCount: 1
    env: {}
  - name: review-service
    image: travelgraph-review-service
    port: 8085
    replicaCount: 1
    env: {}

subgraphDefaults:
  springProfile: dev
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: true
  host: travelgraph.local
  className: ""
  annotations: {}

grafana:
  enabled: true
  image: grafana/grafana:11.1.0
  rootUrl: "%(protocol)s://%(domain)s/grafana/"
