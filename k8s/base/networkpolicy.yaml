apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: subgraphs-from-router-only
  labels:
    app.kubernetes.io/part-of: travelgraph
spec:
  podSelector:
    matchExpressions:
      - key: travelgraph.io/tier
        operator: In
        values:
          - subgraph
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: router
      ports:
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8082
        - protocol: TCP
          port: 8083
        - protocol: TCP
          port: 8084
        - protocol: TCP
          port: 8085

