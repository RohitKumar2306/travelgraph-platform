apiVersion: v1
kind: Service
metadata:
  name: schema-registry
  labels:
    app.kubernetes.io/name: schema-registry
    app.kubernetes.io/part-of: travelgraph
spec:
  ports:
    - name: http
      port: 8090
      targetPort: 8090
  selector:
    app.kubernetes.io/name: schema-registry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry
  labels:
    app.kubernetes.io/name: schema-registry
    app.kubernetes.io/part-of: travelgraph
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: schema-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: schema-registry
        app.kubernetes.io/part-of: travelgraph
    spec:
      containers:
        - name: schema-registry
          image: ghcr.io/travelgraph-platform/travelgraph-schema-registry:latest
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: travelgraph
            - name: DB_USER
              value: travelgraph
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: travelgraph-secrets
                  key: postgres-password
            - name: COMPOSER_NODE_BIN
              value: node
            - name: COMPOSER_HELPER_ROOT
              value: /app/node-helper
            - name: AI_SCHEMA_ASSISTANT_URL
              value: http://ai-schema-assistant:8091
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
