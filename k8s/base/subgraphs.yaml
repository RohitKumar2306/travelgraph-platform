apiVersion: v1
kind: Service
metadata:
  name: property-service
  labels:
    app.kubernetes.io/name: property-service
    app.kubernetes.io/part-of: travelgraph
    travelgraph.io/tier: subgraph
spec:
  ports:
    - name: http
      port: 8081
      targetPort: 8081
  selector:
    app.kubernetes.io/name: property-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: property-service
  labels:
    app.kubernetes.io/name: property-service
    app.kubernetes.io/part-of: travelgraph
    travelgraph.io/tier: subgraph
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: property-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: property-service
        app.kubernetes.io/part-of: travelgraph
        travelgraph.io/tier: subgraph
    spec:
      containers:
        - name: property-service
          image: ghcr.io/travelgraph-platform/travelgraph-property-service:latest
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: dev
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: travelgraph
            - name: DB_USER
              value: travelgraph
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: travelgraph-secrets
                  key: postgres-password
            - name: SCHEMA_REGISTRY_URL
              value: http://schema-registry:8090
            - name: TRAVELGRAPH_IDENTITY_SECRET
              valueFrom:
                secretKeyRef:
                  name: travelgraph-secrets
                  key: identity-hmac-key
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
