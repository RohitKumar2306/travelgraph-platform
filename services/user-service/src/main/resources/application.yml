server:
  port: 8084

spring:
  application:
    name: user-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:travelgraph}?currentSchema=user_schema
    username: ${DB_USER:travelgraph}
    password: ${DB_PASSWORD:travelgraph}
    hikari:
      maximum-pool-size: 10
      pool-name: user-pool
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: user_schema
        jdbc.time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    schemas: user_schema
    default-schema: user_schema
    create-schemas: false
    locations: classpath:db/migration
    baseline-on-migrate: true

graphql:
  packages:
    - "com.travelgraph.user"
  endpoint: "graphql"
  graphiql:
    enabled: false
    endpoint: "graphiql"
  introspection:
    enabled: false
  federation:
    enabled: true
    optInFederationV2: true
    tracing:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: user-service

logging:
  level:
    root: INFO
    com.travelgraph: INFO
