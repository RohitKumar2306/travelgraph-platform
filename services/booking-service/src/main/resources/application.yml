server:
  port: 8083

spring:
  application:
    name: booking-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:travelgraph}?currentSchema=booking_schema
    username: ${DB_USER:travelgraph}
    password: ${DB_PASSWORD:travelgraph}
    hikari:
      maximum-pool-size: 10
      pool-name: booking-pool
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: booking_schema
        jdbc.time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    schemas: booking_schema
    default-schema: booking_schema
    create-schemas: false
    locations: classpath:db/migration
    baseline-on-migrate: true

graphql:
  packages:
    - "com.travelgraph.booking"
  endpoint: "graphql"
  graphiql:
    enabled: false
    endpoint: "graphiql"
  introspection:
    enabled: false
  federation:
    enabled: true
    optInFederationV2: true
    tracing:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: booking-service
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c
  otlp:
    tracing:
      endpoint: http://${OTEL_COLLECTOR_HOST:localhost}:4318/v1/traces

# Per-property room inventory used by availableRooms. Demo-grade: every property
# has the same shape until phase 3 introduces a real inventory subgraph.
travelgraph:
  booking:
    inventory:
      - code: STANDARD
        name: Standard Room
        capacity: 2
        total: 10
      - code: DELUXE
        name: Deluxe Room
        capacity: 3
        total: 5
      - code: SUITE
        name: Suite
        capacity: 4
        total: 2

logging:
  level:
    root: INFO
    com.travelgraph: INFO
