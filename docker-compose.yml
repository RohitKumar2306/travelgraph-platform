# TravelGraph Platform - local dev compose
#
# A single Postgres instance hosts one schema per subgraph. Each subgraph runs
# its own Flyway migrations against its own schema, modelling the production
# "service owns its data" boundary while staying cheap to spin up locally.
#
# Subgraphs are gated behind the `subgraphs` profile. Bring everything online
# with:    docker compose --profile subgraphs up -d   (or `make up`).
# `docker compose up postgres` still works for working on a single subgraph
# locally outside of Docker.
name: travelgraph

x-subgraph-env: &subgraph-env
  SPRING_PROFILES_ACTIVE: dev
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: travelgraph
  DB_USER: travelgraph
  DB_PASSWORD: travelgraph

services:
  postgres:
    image: postgres:16-alpine
    container_name: travelgraph-postgres
    environment:
      POSTGRES_USER: travelgraph
      POSTGRES_PASSWORD: travelgraph
      POSTGRES_DB: travelgraph
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelgraph -d travelgraph"]
      interval: 5s
      timeout: 5s
      retries: 20

  property-service:
    build:
      context: ./services/property-service
    image: travelgraph/property-service:dev
    container_name: travelgraph-property
    profiles: ["subgraphs"]
    environment: *subgraph-env
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  pricing-service:
    build:
      context: ./services/pricing-service
    image: travelgraph/pricing-service:dev
    container_name: travelgraph-pricing
    profiles: ["subgraphs"]
    environment: *subgraph-env
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  booking-service:
    build:
      context: ./services/booking-service
    image: travelgraph/booking-service:dev
    container_name: travelgraph-booking
    profiles: ["subgraphs"]
    environment: *subgraph-env
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    build:
      context: ./services/user-service
    image: travelgraph/user-service:dev
    container_name: travelgraph-user
    profiles: ["subgraphs"]
    environment: *subgraph-env
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy

  review-service:
    build:
      context: ./services/review-service
    image: travelgraph/review-service:dev
    container_name: travelgraph-review
    profiles: ["subgraphs"]
    environment: *subgraph-env
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Phase 3: schema composer. Profile `composer` runs the supergraph composer
  # on demand:
  #     docker compose --profile subgraphs --profile composer run --rm composer
  #
  # Output is written to ./schema-registry/supergraph/supergraph.graphql which
  # is bind-mounted into the router (Phase 3.3) so a fresh compose immediately
  # rolls out to the next request.
  # ---------------------------------------------------------------------------
  composer:
    build:
      context: ./schema-registry/composer
    image: travelgraph/composer:dev
    container_name: travelgraph-composer
    profiles: ["composer"]
    volumes:
      - ./schema-registry/supergraph:/supergraph
    depends_on:
      property-service:
        condition: service_started
      pricing-service:
        condition: service_started
      booking-service:
        condition: service_started
      user-service:
        condition: service_started
      review-service:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Phase 2: Rust router. Profile `router` brings up the router; including
  # both `subgraphs` and `router` profiles starts the whole stack:
  #     docker compose --profile subgraphs --profile router up -d
  #
  # The router depends on every subgraph being container-up (not strictly
  # healthy - subgraphs themselves take a moment to finish Flyway migrations
  # and the router will surface upstream errors as GraphQL errors during the
  # warmup window, which is the desired behaviour for Phase 2.4 testing).
  # ---------------------------------------------------------------------------
  router:
    build:
      context: ./router
    image: travelgraph/router:dev
    container_name: travelgraph-router
    profiles: ["router"]
    ports:
      - "8080:8080"
    volumes:
      # Phase 3.3: the router reads the composed supergraph at startup. We
      # bind-mount the schema-registry output directory so a fresh
      # `make compose` rolls out to the next router restart without a rebuild.
      - ./schema-registry/supergraph:/app/supergraph
    environment:
      RUST_LOG: info
      ROUTER_CONFIG: /app/config/router.toml
    depends_on:
      property-service:
        condition: service_started
      pricing-service:
        condition: service_started
      booking-service:
        condition: service_started
      user-service:
        condition: service_started
      review-service:
        condition: service_started

volumes:
  pgdata:
