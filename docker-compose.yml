# TravelGraph Platform - local dev compose
#
# A single Postgres instance hosts one schema per subgraph. Each subgraph runs
# its own Flyway migrations against its own schema, modelling the production
# "service owns its data" boundary while staying cheap to spin up locally.
#
# Subgraphs are gated behind the `subgraphs` profile. Bring everything online
# with:    docker compose --profile subgraphs up -d   (or `make up`).
# `docker compose up postgres` still works for working on a single subgraph
# locally outside of Docker.
name: travelgraph

x-subgraph-env: &subgraph-env
  SPRING_PROFILES_ACTIVE: dev
  OTEL_COLLECTOR_HOST: otel-collector
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: travelgraph
  DB_USER: travelgraph
  DB_PASSWORD: travelgraph
  SCHEMA_REGISTRY_URL: http://schema-registry:8090

services:
  postgres:
    image: postgres:16-alpine
    container_name: travelgraph-postgres
    environment:
      POSTGRES_USER: travelgraph
      POSTGRES_PASSWORD: travelgraph
      POSTGRES_DB: travelgraph
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelgraph -d travelgraph"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: travelgraph-redis
    ports:
      - "6379:6379"

  schema-registry:
    build:
      context: ./schema-registry/registry
    image: travelgraph/schema-registry:dev
    container_name: travelgraph-schema-registry
    profiles: ["subgraphs", "schema-platform", "observability"]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: travelgraph
      DB_USER: travelgraph
      DB_PASSWORD: travelgraph
      COMPOSER_NODE_BIN: node
      COMPOSER_HELPER_ROOT: /app/node-helper
      AI_SCHEMA_ASSISTANT_URL: http://ai-schema-assistant:8091
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy

  ai-schema-assistant:
    build:
      context: ./ai-schema-assistant
    image: travelgraph/ai-schema-assistant:dev
    container_name: travelgraph-ai-schema-assistant
    profiles: ["schema-platform", "observability"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-sonnet-latest}
    ports:
      - "8091:8091"

  property-service:
    build:
      context: ./services/property-service
    image: travelgraph/property-service:dev
    container_name: travelgraph-property
    profiles: ["subgraphs", "observability"]
    environment: *subgraph-env
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      schema-registry:
        condition: service_started

  pricing-service:
    build:
      context: ./services/pricing-service
    image: travelgraph/pricing-service:dev
    container_name: travelgraph-pricing
    profiles: ["subgraphs", "observability"]
    environment: *subgraph-env
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      schema-registry:
        condition: service_started

  booking-service:
    build:
      context: ./services/booking-service
    image: travelgraph/booking-service:dev
    container_name: travelgraph-booking
    profiles: ["subgraphs", "observability"]
    environment: *subgraph-env
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      schema-registry:
        condition: service_started

  user-service:
    build:
      context: ./services/user-service
    image: travelgraph/user-service:dev
    container_name: travelgraph-user
    profiles: ["subgraphs", "observability"]
    environment: *subgraph-env
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      schema-registry:
        condition: service_started

  review-service:
    build:
      context: ./services/review-service
    image: travelgraph/review-service:dev
    container_name: travelgraph-review
    profiles: ["subgraphs", "observability"]
    environment: *subgraph-env
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      schema-registry:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Phase 3: schema composer. Profile `composer` runs the supergraph composer
  # on demand:
  #     docker compose --profile subgraphs --profile composer run --rm composer
  #
  # Output is written to ./schema-registry/supergraph/supergraph.graphql which
  # is bind-mounted into the router (Phase 3.3) so a fresh compose immediately
  # rolls out to the next request.
  # ---------------------------------------------------------------------------
  composer:
    build:
      context: ./schema-registry/composer
    image: travelgraph/composer:dev
    container_name: travelgraph-composer
    profiles: ["composer"]
    volumes:
      - ./schema-registry/supergraph:/supergraph
    depends_on:
      property-service:
        condition: service_started
      pricing-service:
        condition: service_started
      booking-service:
        condition: service_started
      user-service:
        condition: service_started
      review-service:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Phase 2: Rust router. Profile `router` brings up the router; including
  # both `subgraphs` and `router` profiles starts the whole stack:
  #     docker compose --profile subgraphs --profile router up -d
  #
  # The router depends on every subgraph being container-up (not strictly
  # healthy - subgraphs themselves take a moment to finish Flyway migrations
  # and the router will surface upstream errors as GraphQL errors during the
  # warmup window, which is the desired behaviour for Phase 2.4 testing).
  # ---------------------------------------------------------------------------
  router:
    build:
      context: ./router
    image: travelgraph/router:dev
    container_name: travelgraph-router
    profiles: ["router", "observability"]
    ports:
      - "8080:8080"
    volumes:
      # Phase 3.3: the router reads the composed supergraph at startup. We
      # bind-mount the schema-registry output directory so a fresh
      # `make compose` rolls out to the next router restart without a rebuild.
      - ./schema-registry/supergraph:/app/supergraph
    environment:
      RUST_LOG: info
      ROUTER_CONFIG: /app/config/router.toml
      ROUTER_REDIS_URL: redis://redis:6379
      ROUTER_CACHE_ENABLED: "true"
      ROUTER_ALLOW_ARBITRARY_QUERIES: "true"
      SCHEMA_REGISTRY_USAGE_ENDPOINT: http://schema-registry:8090/usage
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      redis:
        condition: service_started
      property-service:
        condition: service_started
      pricing-service:
        condition: service_started
      booking-service:
        condition: service_started
      user-service:
        condition: service_started
      review-service:
        condition: service_started
      schema-registry:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: travelgraph-otel-collector
    profiles: ["observability"]
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol-contrib/config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
      - "8889:8889"
    depends_on:
      jaeger:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: travelgraph-prometheus
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: travelgraph-jaeger
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "14250:14250"
      - "4319:4317"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: travelgraph-grafana
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana-dashboard.json:/var/lib/grafana/dashboards/travelgraph-platform.json:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started
      jaeger:
        condition: service_started

volumes:
  pgdata:
