[workspace]
resolver = "2"
members = ["crates/travelgraph-router"]

# Centralized dependency versions so that future workspace crates inherit one
# consistent toolchain. Only the binary crate exists today.
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["TravelGraph Platform"]
publish = false

[workspace.dependencies]
tokio              = { version = "1.40", features = ["full"] }
axum               = { version = "0.7" }
tower              = { version = "0.4" }
tower-http         = { version = "0.5", features = ["trace"] }
tracing            = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = { version = "1" }
reqwest            = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
apollo-compiler    = { version = "1.27" }
uuid               = { version = "1", features = ["v4", "serde"] }
toml               = { version = "0.8" }
anyhow             = { version = "1" }
thiserror          = { version = "1" }
futures            = { version = "0.3" }

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"
opt-level     = 3
panic         = "abort"
