[workspace]
resolver = "2"
members = ["crates/travelgraph-router"]

# Centralized dependency versions so that future workspace crates inherit one
# consistent toolchain. Only the binary crate exists today.
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["TravelGraph Platform"]
publish = false

[workspace.dependencies]
tokio              = { version = "1.40", features = ["full"] }
axum               = { version = "0.7" }
tower              = { version = "0.4", features = ["retry", "timeout", "util", "limit"] }
tower-http         = { version = "0.5", features = ["trace"] }
dashmap            = { version = "6" }
governor           = { version = "0.8" }
tracing            = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = { version = "0.24" }
opentelemetry      = { version = "0.23" }
opentelemetry_sdk  = { version = "0.23", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.16", features = ["grpc-tonic"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = { version = "1" }
reqwest            = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
redis              = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager"] }
metrics            = { version = "0.24", default-features = false }
metrics-exporter-prometheus = { version = "0.16", default-features = false }
sha2               = { version = "0.10" }
hex                = { version = "0.4" }
hmac               = { version = "0.12" }
jsonwebtoken       = { version = "9" }
time               = { version = "=0.3.41" }
http               = { version = "1" }
parking_lot        = { version = "0.12" }
once_cell          = { version = "1.19" }
apollo-compiler    = { version = "1.27" }
uuid               = { version = "1", features = ["v4", "serde"] }
toml               = { version = "0.8" }
anyhow             = { version = "1" }
thiserror          = { version = "1" }
futures            = { version = "0.3" }

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"
opt-level     = 3
panic         = "abort"
