name: AI Schema Review

on:
  pull_request:
    paths:
      - "services/**"
      - "schema-registry/**"
      - "docs/graphql-conventions.md"
      - "scripts/ci/ai_schema_review.py"
      - ".github/workflows/ai-review.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    name: Advisory AI schema review
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-3-5-sonnet-latest' }}
      AI_SCHEMA_ASSISTANT_URL: http://localhost:8091
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Initialize AI review output
        run: printf '## AI Schema Review (advisory)\n\nAI review did not complete.\n' > ai-review-comment.md

      - name: Install AI assistant dependencies
        run: python -m pip install -r ai-schema-assistant/requirements.txt

      - name: Start AI schema assistant
        run: |
          (
            cd ai-schema-assistant
            python -m uvicorn app:app --host 0.0.0.0 --port 8091 > ../ai-schema-assistant.log 2>&1 &
            echo "$!" > ../ai-schema-assistant.pid
          )
          for attempt in {1..30}; do
            if curl -fsS "${AI_SCHEMA_ASSISTANT_URL}/health" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat ai-schema-assistant.log
          exit 1

      - name: Run advisory schema review
        run: |
          python3 scripts/ci/ai_schema_review.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head HEAD \
            --assistant-url "${AI_SCHEMA_ASSISTANT_URL}" \
            --out ai-review-comment.md

      - name: Post AI schema review comment
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- travelgraph-ai-schema-review -->';
            const body = marker + '\n' + fs.readFileSync('ai-review-comment.md', 'utf8');
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number});
            const previous = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body && comment.body.includes(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({owner, repo, comment_id: previous.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }
