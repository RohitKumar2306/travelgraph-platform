name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  router:
    name: Router checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: router
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.86.0
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: router

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all

  subgraphs:
    name: ${{ matrix.service }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: property-service
            path: services/property-service
          - service: pricing-service
            path: services/pricing-service
          - service: booking-service
            path: services/booking-service
          - service: user-service
            path: services/user-service
          - service: review-service
            path: services/review-service
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Run tests with JaCoCo
        run: gradle --no-daemon test jacocoTestReport

  schema-registry:
    name: Schema registry tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: schema-registry/registry
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Run tests
        run: gradle --no-daemon test

  manifests:
    name: Kubernetes manifest validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install kubectl
        run: |
          curl -fsSLo kubectl "https://dl.k8s.io/release/v1.30.2/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Install kubeval
        run: |
          curl -fsSL "https://github.com/instrumenta/kubeval/releases/download/0.16.1/kubeval-linux-amd64.tar.gz" | tar xz
          sudo mv kubeval /usr/local/bin/kubeval

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Validate manifests
        run: |
          if [ ! -d k8s ]; then
            echo "No k8s/ directory found; manifest validation skipped."
            exit 0
          fi

          kubectl kustomize k8s/overlays/local > /tmp/travelgraph-local.yaml
          kubectl kustomize k8s/overlays/prod > /tmp/travelgraph-prod.yaml
          helm template travelgraph k8s/helm/travelgraph > /tmp/travelgraph-helm.yaml

          if kubectl version --request-timeout=5s >/dev/null 2>&1; then
            kubectl apply --dry-run=client --validate=false -f /tmp/travelgraph-local.yaml
            kubectl apply --dry-run=client --validate=false -f /tmp/travelgraph-prod.yaml
          else
            echo "No Kubernetes API server is available; rendered manifests will be validated offline."
          fi

          kubeval --strict /tmp/travelgraph-local.yaml /tmp/travelgraph-prod.yaml /tmp/travelgraph-helm.yaml

  docker-images:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-latest
    needs:
      - router
      - subgraphs
      - schema-registry
      - manifests
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: property-service
            context: services/property-service
          - image: pricing-service
            context: services/pricing-service
          - image: booking-service
            context: services/booking-service
          - image: user-service
            context: services/user-service
          - image: review-service
            context: services/review-service
          - image: router
            context: router
          - image: schema-registry
            context: schema-registry/registry
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/travelgraph-${{ matrix.image }}:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/travelgraph-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
